name: Release

# Push a tag like v0.1.0 to build native binaries for every platform and publish them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  asset: beemr-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: beemr-linux-aarch64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,       asset: beemr-macos-aarch64 }
          - { os: macos-latest,     target: x86_64-apple-darwin,        asset: beemr-macos-x86_64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     asset: beemr-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Collect binary
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/beemr
          [[ "${{ matrix.target }}" == *windows* ]] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum beemr-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            beemr-*
            SHA256SUMS
          generate_release_notes: true
