name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docs:
    name: Docs smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: tests/docs-smoke.sh target/release/beemr

  tor:
    # The last-resort path, over the real Tor network (the NAT lab is offline).
    name: Tor fallback (real network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Share and download over Tor only
        shell: bash
        env:
          BEEMR_FORCE_PATH: tor
        run: |
          B=$PWD/target/release/beemr
          mkdir -p a b dl
          head -c 2000000 /dev/urandom > file.bin
          BEEMR_HOME=$PWD/a $B share file.bin > ticket 2> share.log &
          for _ in $(seq 1 90); do grep -q "Tor ready" share.log && break; sleep 2; done
          cat share.log
          grep -q "Tor ready" share.log || { echo "::error::the onion service didn't start"; exit 1; }
          BEEMR_HOME=$PWD/b timeout 300 $B get "$(awk '{print $3}' ticket)" -o dl 2>&1 | tee get.log
          grep -q "How: relayed through Tor" get.log || { echo "::error::expected a Tor transfer"; exit 1; }
          cmp file.bin dl/file.bin
          sleep 2
          grep -q "How: relayed through Tor" share.log

  natlab:
    name: NAT lab (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hole punching and port prediction race packets through NATs and
          # aren't guaranteed, so those scenarios require the transfer to
          # succeed and report which path it took.
          - scenario: cone NAT, hole punching
            args: cone
            expect: success
            path: ""
            report: "punched through both firewalls"
          - scenario: cone + symmetric NAT, port prediction
            args: mixed
            expect: success
            path: ""
            report: "port prediction"
          - scenario: symmetric NAT, dedicated relay
            args: symmetric
            expect: success
            path: "How: relayed through beemr relay"
            report: ""
          - scenario: symmetric NAT, another user's beemr relays
            args: peerrelay
            expect: success
            path: "How: relayed through beemr relay 172.30.0.7"
            report: ""
          - scenario: no relay available
            args: symmetric --no-relay
            expect: failure
            path: ""
            report: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Run scenario
        shell: bash
        run: |
          set +e
          tests/natlab/run.sh ${{ matrix.args }} 2>&1 | tee lab.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "${{ matrix.expect }}" == success ]]; then
            [[ $status == 0 ]] || { echo "::error::transfer failed"; exit 1; }
            if [[ -n "${{ matrix.path }}" ]]; then
              grep -qF "${{ matrix.path }}" lab.log || { echo "::error::expected path: ${{ matrix.path }}"; exit 1; }
            fi
            if [[ -n "${{ matrix.report }}" ]]; then
              if grep -qF "${{ matrix.report }}" lab.log; then
                echo "::notice::direct connection made (${{ matrix.report }})"
              else
                echo "::warning::'${{ matrix.report }}' did not succeed this run; a relay carried the transfer"
              fi
            fi
            grep -q "sent md5" lab.log && [[ "$(grep -o 'sent md5: *[0-9a-f]*' lab.log | awk '{print $3}')" == "$(grep -o 'received md5: *[0-9a-f]*' lab.log | awk '{print $3}')" ]] \
              || { echo "::error::file corrupted"; exit 1; }
          else
            [[ $status != 0 ]] || { echo "::error::expected the transfer to fail"; exit 1; }
            grep -qE "relay|couldn't connect" lab.log || { echo "::error::expected a helpful error"; exit 1; }
          fi
